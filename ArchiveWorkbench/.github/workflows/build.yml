name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      
      - name: Build ArchiveWorkbench
        run: |
          cd .worktrees/foundation/ArchiveWorkbench
          DEVELOPER_DIR=/Applications/Xcode_26.0.app/Contents/Developer \
            xcodebuild -project ArchiveWorkbench.xcodeproj \
                       -scheme ArchiveWorkbench \
                       -configuration Release \
                       -destination 'platform=macOS' \
                       clean build
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacUnzip-${{ github.sha }}
          path: .worktrees/foundation/ArchiveWorkbench/Build/Products/Release/MacUnzip.app
