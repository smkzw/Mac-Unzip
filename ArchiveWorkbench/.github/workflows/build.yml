name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Build MacUnzip
        run: |
          cd .worktrees/foundation/ArchiveWorkbench
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
          DEVELOPER_DIR=/Applications/Xcode_26.0.app/Contents/Developer \
            xcodebuild -project MacUnzip.xcodeproj \
                       -scheme MacUnzip \
                       -configuration Release \
                       -destination 'platform=macOS' \
                       clean build
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacUnzip-${{ github.sha }}
          path: .worktrees/foundation/ArchiveWorkbench/Build/Products/Release/MacUnzip.app
