<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Light mode version of the same interface -->
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F9FAFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sidebarGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F9FAFB;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Main window background -->
  <rect width="800" height="600" rx="12" fill="url(#bgGradLight)" filter="url(#shadowLight)"/>
  
  <!-- Window chrome (traffic lights) -->
  <circle cx="60" cy="38" r="10" fill="#EF4444"/>
  <circle cx="80" cy="38" r="10" fill="#F59E0B"/>
  <circle cx="100" cy="38" r="10" fill="#10B981"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="200" height="600" fill="url(#sidebarGradLight)" stroke="rgba(0,0,0,0.08)" stroke-width="1" rx="12 0 0 0"/>
  
  <!-- App title -->
  <text x="140" y="40" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#111827">MacUnzip Pro</text>
  
  <!-- Search bar -->
  <rect x="20" y="60" width="160" height="36" rx="8" fill="#F3F4F6" stroke="rgba(0,0,0,0.1)"/>
  <text x="40" y="84" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#6B7280">🔍 Search archives...</text>
  
  <!-- Sidebar menu items -->
  <g transform="translate(40, 120)">
    <rect width="120" height="40" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="10" y="26" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#4F46E5">📦 Archives</text>
    
    <rect x="0" y="50" width="120" height="40" rx="8" fill="none"/>
    <text x="10" y="76" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#4B5563">⭐ Favorites</text>
    
    <rect x="0" y="100" width="120" height="40" rx="8" fill="none"/>
    <text x="10" y="126" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#4B5563">☁️ iCloud</text>
  </g>
  
  <!-- Main content area -->
  <rect x="200" y="0" width="600" height="600" rx="12" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  
  <!-- Toolbar -->
  <rect x="20" y="20" width="560" height="48" rx="10" fill="#F9FAFB" stroke="rgba(0,0,0,0.08)"/>
  <text x="40" y="50" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#111827">Archive Browser</text>
  
  <circle cx="530" cy="44" r="16" fill="#EEF2FF"/>
  <text x="524" y="49" font-size="14">⚙️</text>
  
  <!-- Archive file list header -->
  <text x="220" y="90" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6B7280">NAME</text>
  <text x="400" y="90" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6B7280">SIZE</text>
  <text x="520" y="90" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6B7280">TYPE</text>
  
  <!-- File entries -->
  <g transform="translate(20, 110)">
    <!-- Line 1 -->
    <rect width="560" height="44" rx="6" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="10" y="28" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#111827">📁 Documents_2024.zip</text>
    <text x="380" y="28" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#6B7280">24.5 MB</text>
    <text x="500" y="28" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#4F46E5">ZIP</text>
    
    <!-- Line 2 -->
    <rect x="0" y="50" width="560" height="44" rx="6" fill="#FFFFFF" stroke="rgba(0,0,0,0.06)"/>
    <text x="10" y="78" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#111827">📷 Vacation_Photos.tar</text>
    <text x="380" y="78" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#6B7280">156 MB</text>
    <text x="500" y="78" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#6B7280">TAR</text>
    
    <!-- Line 3 -->
    <rect x="0" y="100" width="560" height="44" rx="6" fill="#FFFFFF" stroke="rgba(0,0,0,0.06)"/>
    <text x="10" y="128" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#111827">🎵 Music_Library.7z</text>
    <text x="380" y="128" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#6B7280">89.2 MB</text>
    <text x="500" y="128" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#10B981">7Z</text>
    
    <!-- Line 4 -->
    <rect x="0" y="150" width="560" height="44" rx="6" fill="#FFFFFF" stroke="rgba(0,0,0,0.06)"/>
    <text x="10" y="178" font-family="Inter, -apple-system, sans-serif" font-size="14" fill="#111827">💼 Project_Alpha.rar</text>
    <text x="380" y="178" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#6B7280">42.8 MB</text>
    <text x="500" y="178" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#F59E0B">RAR</text>
  </g>
  
  <!-- Preview panel placeholder -->
  <rect x="20" y="190" width="270" height="360" rx="10" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  <text x="35" y="220" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#111827">Preview</text>
  
  <!-- Preview image placeholder -->
  <rect x="35" y="230" width="240" height="200" rx="8" fill="#F3F4F6" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  <circle cx="155" cy="330" r="60" fill="#EEF2FF"/>
  <text x="155" y="335" text-anchor="middle" font-size="48">🖼️</text>
  
  <!-- Preview info -->
  <text x="35" y="450" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#6B7280">File size: 4.2 MB</text>
  <text x="35" y="470" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#6B7280">Dimensions: 1920×1080</text>
  <text x="35" y="490" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#6B7280">Format: PNG</text>
  
  <!-- Floating action button -->
  <circle cx="730" cy="540" r="48" fill="url(#btnGrad)" filter="url(#glow)"/>
  <text x="730" y="554" text-anchor="middle" font-size="32">➕</text>
  
  <!-- Status bar -->
  <rect x="20" y="560" width="560" height="30" rx="6" fill="#F9FAFB" stroke="rgba(0,0,0,0.08)"/>
  <text x="30" y="580" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#4F46E5">✔ 4 items loaded</text>
  <text x="500" y="580" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#6B7280">macOS 26.5 • ARM64</text>
</svg>
