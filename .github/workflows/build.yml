name: Build & Test

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: ArchiveKit unit tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Verify Swift toolchain
        run: |
          xcodebuild -version
          swift_version="$(swift --version)"
          printf '%s\n' "$swift_version"
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          grep -q '^Apple Swift version ' <<< "$swift_version"

      - name: Cache Homebrew
        uses: actions/cache@v6
        with:
          path: |
            $(brew --prefix)/opt/libarchive
            $(brew --prefix)/opt/xz
            $(brew --prefix)/opt/zstd
            $(brew --prefix)/opt/lz4
            $(brew --prefix)/opt/libb2
            ~/Library/Caches/Homebrew
          key: brew-archivekit-${{ runner.os }}-${{ hashFiles('**/Package.swift') }}

      - name: Install libarchive
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew list libarchive >/dev/null 2>&1 || brew install libarchive xz zstd lz4 libb2

      - name: Prepare pinned 7zz
        working-directory: ArchiveWorkbench
        run: |
          ./Scripts/prepare_7zz.sh
          test -x App/Binaries/7zz
          export MACUNZIP_PINNED_7ZZ="$PWD/App/Binaries/7zz"
          echo "MACUNZIP_PINNED_7ZZ=$MACUNZIP_PINNED_7ZZ" >> "$GITHUB_ENV"
          echo "MACUNZIP_REQUIRE_PINNED_7ZZ=1" >> "$GITHUB_ENV"

      - name: Run ArchiveKit tests
        working-directory: ArchiveWorkbench/Packages/ArchiveKit
        env:
          MACUNZIP_PINNED_7ZZ: ${{ env.MACUNZIP_PINNED_7ZZ }}
          MACUNZIP_REQUIRE_PINNED_7ZZ: "1"
        run: |
          swift test --parallel

  app:
    name: MacUnzip build & tests
    runs-on: macos-26
    timeout-minutes: 60
    needs: unit
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Verify Swift toolchain
        run: |
          xcodebuild -version
          swift_version="$(swift --version)"
          printf '%s\n' "$swift_version"
          echo "DEVELOPER_DIR=$(xcode-select -p)"
          grep -q '^Apple Swift version ' <<< "$swift_version"

      - name: Cache Homebrew
        uses: actions/cache@v6
        with:
          path: |
            $(brew --prefix)/opt/libarchive
            $(brew --prefix)/opt/xz
            $(brew --prefix)/opt/zstd
            $(brew --prefix)/opt/lz4
            $(brew --prefix)/opt/libb2
            ~/Library/Caches/Homebrew
          key: brew-app-${{ runner.os }}-${{ hashFiles('ArchiveWorkbench/Packages/ArchiveKit/Package.swift') }}

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: ~/spm
          key: spm-${{ runner.os }}-${{ hashFiles('ArchiveWorkbench/MacUnzip.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Install build dependencies
        working-directory: ArchiveWorkbench
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew list libarchive >/dev/null 2>&1 || brew install libarchive xz zstd lz4 libb2

      - name: Prepare pinned 7zz
        working-directory: ArchiveWorkbench
        run: |
          ./Scripts/prepare_7zz.sh
          test -x App/Binaries/7zz
          echo "MACUNZIP_PINNED_7ZZ=$PWD/App/Binaries/7zz" >> "$GITHUB_ENV"
          echo "MACUNZIP_REQUIRE_PINNED_7ZZ=1" >> "$GITHUB_ENV"

      - name: Build MacUnzip
        working-directory: ArchiveWorkbench
        run: |
          # Independent derived data for Release so verify/zip use the same real path.
          xcodebuild -project MacUnzip.xcodeproj \
                     -scheme MacUnzip \
                     -configuration Release \
                     -destination 'platform=macOS' \
                     -derivedDataPath "$PWD/build/ReleaseDD" \
                     -clonedSourcePackagesDirPath "$HOME/spm" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build
          test -x "build/ReleaseDD/Build/Products/Release/MacUnzip.app/Contents/MacOS/MacUnzip"

      - name: Run unit tests (no UI suite)
        working-directory: ArchiveWorkbench
        env:
          MACUNZIP_PINNED_7ZZ: ${{ env.MACUNZIP_PINNED_7ZZ }}
          MACUNZIP_REQUIRE_PINNED_7ZZ: "1"
        run: |
          # Separate Debug derived data — never reuse ReleaseDD products for tests.
          xcodebuild -project MacUnzip.xcodeproj \
                     -scheme MacUnzip \
                     -configuration Debug \
                     -destination 'platform=macOS' \
                     -derivedDataPath "$PWD/build/DebugDD" \
                     -clonedSourcePackagesDirPath "$HOME/spm" \
                     -only-testing:MacUnzipUnitTests \
                     -only-testing:HelperSpikeTests \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     test

      - name: Verify self-contained dylibs and pinned 7zz
        working-directory: ArchiveWorkbench
        run: |
          APP="build/ReleaseDD/Build/Products/Release/MacUnzip.app"
          BIN="$APP/Contents/MacOS/MacUnzip"
          test -f "$BIN"
          if otool -L "$BIN" | grep -E '/opt/homebrew|/usr/local/opt'; then
            echo "::error::App still references Homebrew absolute dylib paths"
            otool -L "$BIN"
            exit 1
          fi
          test -f "$APP/Contents/Frameworks/libarchive.13.dylib"
          BUNDLED="$APP/Contents/Resources/Binaries/7zz"
          test -x "$BUNDLED"
          ACTUAL="$(shasum -a 256 "$BUNDLED" | awk '{print $1}')"
          EXPECTED="3bdfeac2b07b2057cbc2fa3d86aef455739f253cd57733eea3d490065081163e"
          test "$ACTUAL" = "$EXPECTED"
          test -f "$APP/Contents/Resources/Binaries/7zz-License.txt"
          test -f "$APP/Contents/Resources/Binaries/7zz-SOURCE.txt"
          echo "Self-contained + pinned 7zz check OK"

      - name: Package artifact as zip
        run: |
          ditto -c -k --keepParent \
            ArchiveWorkbench/build/ReleaseDD/Build/Products/Release/MacUnzip.app \
            MacUnzip-${{ github.sha }}.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MacUnzip-${{ github.sha }}
          path: MacUnzip-${{ github.sha }}.zip
          retention-days: 14
