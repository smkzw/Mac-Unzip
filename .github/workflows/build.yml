name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install build dependencies
        working-directory: ArchiveWorkbench
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          # embed-dylibs.sh 需要 libarchive 及其 Homebrew 依赖以构建自包含 app
          brew list libarchive >/dev/null 2>&1 || brew install libarchive xz zstd lz4 libb2

      - name: Generate Xcode project
        working-directory: ArchiveWorkbench
        run: xcodegen generate

      - name: Build MacUnzip
        working-directory: ArchiveWorkbench
        run: |
          DEVELOPER_DIR=/Applications/Xcode_26.0.app/Contents/Developer \
            xcodebuild -project MacUnzip.xcodeproj \
                       -scheme MacUnzip \
                       -configuration Release \
                       -destination 'platform=macOS' \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacUnzip-${{ github.sha }}
          path: ArchiveWorkbench/build/Products/Release/MacUnzip.app
